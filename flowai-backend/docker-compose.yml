version: "3.9"

services:
  backend:
    build: .
    container_name: flowai-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

  postgres:
    image: postgres:16-alpine
    container_name: flowai-postgres
    environment:
      POSTGRES_DB: flowai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: flowai-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
